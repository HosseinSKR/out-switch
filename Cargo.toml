[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Rpc", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true




